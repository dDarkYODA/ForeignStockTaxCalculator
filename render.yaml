services:
  - type: web
    name: tax-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=.. uvicorn main:app --host 0.0.0.0 --port $PORT

  - type: web
    name: tax-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
